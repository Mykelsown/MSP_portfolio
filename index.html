<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/smp-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Samuel Micheal Pelumi: Full-stack software engineer building and shipping frontend and backend systems, deployment pipelines, and production infrastructure. Currently moving into AI and ML engineering."
    />
    <meta name="theme-color" content="#F6F3EE" />
    <link rel="preload" href="/fonts/TeXGyreAdventor-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>Samuel Micheal Pelumi | Full-Stack Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Hidden, unused form: exists only so Netlify's build-time form
      detection (which scans static HTML, not the React bundle) picks up
      this form's fields. The real, interactive form lives in
      src/components/ContactForm.jsx and posts to this same form name.
    -->
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
